[project]
name = "master"
version = "0.1.0"
description = "master"
readme = "README.md"
authors = [
    { name = "Neon", email = "910400024@qq.com" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "blacksmith>=0.1.0",
    "numpy>=2.4.6",
    "torch>=2.14.1",
]

[tool.uv.sources]
blacksmith = { path = "./blacksmith" }

[project.scripts]
master = "master:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
